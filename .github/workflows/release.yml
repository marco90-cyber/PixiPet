name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk PixiPet-${{ github.ref_name }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PixiPet-${{ github.ref_name }}-android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build Windows portable
        run: gradle :desktop:createDistributable --no-daemon
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/PixiPet -DestinationPath PixiPet-${{ github.ref_name }}-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: PixiPet-${{ github.ref_name }}-windows-portable.zip

  release:
    needs: [ android, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "PixiPet ${{ github.ref_name }}" --generate-notes
