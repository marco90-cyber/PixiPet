name: Release

# Si pubblica una release ogni volta che cambia APP_VERSION in Version.kt (push su main).
on:
  push:
    branches: [ main ]
    paths:
      - 'shared/src/main/kotlin/com/marco/pixipet/Version.kt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'APP_VERSION = "\K[0-9.]+' shared/src/main/kotlin/com/marco/pixipet/Version.kt)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Chiave di firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "Mancano i segreti ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD su GitHub (Settings > Secrets and variables > Actions)." >&2
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/pixipet.jks"
          echo "PIXIPET_KEYSTORE=$RUNNER_TEMP/pixipet.jks" >> "$GITHUB_ENV"
          echo "PIXIPET_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk PixiPet-v${{ needs.prepare.outputs.version }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PixiPet-v${{ needs.prepare.outputs.version }}-android.apk

  windows:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build Windows portable
        run: gradle :desktop:createDistributable --no-daemon
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/PixiPet -DestinationPath PixiPet-v${{ needs.prepare.outputs.version }}-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: PixiPet-v${{ needs.prepare.outputs.version }}-windows-portable.zip

  release:
    needs: [ prepare, android, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.prepare.outputs.version }}" dist/* \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "PixiPet v${{ needs.prepare.outputs.version }}" --generate-notes
